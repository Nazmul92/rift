[project]
name = "rift-v2"
version = "0.1.0"
requires-python = ">=3.10"

# Exact versions live in requirements-dev.txt, which also pins the transitive
# closure. This extra names the direct tools; the constraints file is what
# makes a clean environment reproducible.
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.3", "mypy==2.3.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
allow_untyped_defs = true
check_untyped_defs = false
